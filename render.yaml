services:
  - type: web
    name: scolaloop
    env: python
    # Build sans accès base de données : l'hôte interne du Postgres ne résout
    # pas depuis l'environnement de build (erreur « could not translate host name »).
    # migrate + ensure_superuser s'exécutent au démarrage, dans le réseau privé.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py ensure_superuser && gunicorn scolaloop.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scolaloop-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SMS_PROVIDER
        value: "stub"
      # Domaine public canonique : sitemap, canonical et balises Open Graph.
      - key: SITE_URL
        value: "https://www.scolaloop.com"
      # Code de vérification Google Search Console (à renseigner dans Render).
      - key: GOOGLE_SITE_VERIFICATION
        sync: false

databases:
  - name: scolaloop-db
    databaseName: scolaloop
    user: scolaloop_user
    # Plan payant obligatoire : les bases gratuites Render expirent 30 jours
    # apres leur creation (14 jours de grace, puis suppression definitive des
    # donnees). basic-256mb est le plus petit plan payant.
    plan: basic-256mb
