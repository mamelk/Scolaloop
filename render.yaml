services:
  - type: web
    name: scolaloop
    env: python
    # Build sans accès base de données : l'hôte interne du Postgres ne résout
    # pas depuis l'environnement de build (erreur « could not translate host name »).
    # migrate + ensure_superuser s'exécutent au démarrage, dans le réseau privé.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py ensure_superuser && gunicorn scolaloop.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scolaloop-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SMS_PROVIDER
        value: "stub"

databases:
  - name: scolaloop-db
    databaseName: scolaloop
    user: scolaloop_user
    plan: free
